<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MW Hockey Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a coach's clipboard. Brief on the left, the drill sheet with its pitch board on the right; stacks on a phone. */
:root{
  --paper:#f3f5f4; --card:#ffffff; --ink:#14232b; --muted:#5a6b72; --line:#d5dcdb;
  --turf:#1f6fb5; --turf-dark:#185a94; --surround:#2f7d4f; --ball:#ffd21f; --accent:#0e5fa3; --warn:#b3261e; --navy:#002d5a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#0f1a20; --card:#17252d; --ink:#e8eef0; --muted:#9db0b7; --line:#2b3d46; --accent:#6db7f2; --warn:#ff8a80; --navy:#9fd4f5; color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#0f1a20; --card:#17252d; --ink:#e8eef0; --muted:#9db0b7; --line:#2b3d46; --accent:#6db7f2; --warn:#ff8a80; --navy:#9fd4f5; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--navy);padding-bottom:12px}
h1{font-family:var(--display);font-size:2.4rem;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.tag{color:var(--muted);margin:4px 0 0;max-width:60ch}
.langs,.modes{display:flex;gap:4px}
.langs button,.modes button{font:600 .95rem var(--body);padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;cursor:pointer}
.langs button[aria-pressed="true"],.modes button[aria-pressed="true"]{background:var(--turf);border-color:var(--turf);color:#fff}
main{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:20px;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
h2{font-family:var(--display);font-size:1.35rem;text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;text-wrap:balance}
form{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
select,input,textarea{font:400 1rem var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:3px solid var(--ball);outline-offset:1px}
.btn{font:700 1.15rem var(--display);text-transform:uppercase;letter-spacing:.04em;padding:10px 16px;border:0;border-radius:4px;background:var(--turf);color:#fff;cursor:pointer}
.btn:hover{background:var(--turf-dark)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);font-size:1rem;padding:7px 12px}
.status{font-size:.9rem;color:var(--muted);min-height:1.4em}
.status.err{color:var(--warn)}
.sheet{display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start}
.title{font-family:var(--display);font-size:2rem;line-height:1.05;margin:0;text-wrap:balance}
.chip{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--ball);color:#14232b;border-radius:3px;padding:2px 8px;margin-bottom:6px}
.summary{margin:4px 0 0;max-width:65ch}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meta span{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);font-variant-numeric:tabular-nums}
.board{background:var(--surround);border-radius:6px;padding:10px;overflow-x:auto}
.board svg{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.cols{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
.sec h3{font-family:var(--display);font-size:1.1rem;text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px;color:var(--accent)}
.sec ul,.sec ol{margin:0;padding-left:20px;max-width:65ch}
.sec li{margin:2px 0}
.adjust{display:flex;flex-direction:row;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.adjust input{flex:1 1 220px}
.saved{display:flex;flex-direction:column;gap:6px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.saved[hidden]{display:none}
.saved button{font:500 .9rem var(--body);text-align:left;background:transparent;border:0;color:var(--accent);padding:2px 0;cursor:pointer;text-decoration:underline}
.note{font-size:.82rem;color:var(--muted);max-width:70ch}
.modes button{flex:1}
.scoring{border-left:4px solid var(--ball);padding:6px 12px;background:var(--paper);border-radius:0 4px 4px 0;max-width:70ch}
[hidden]{display:none!important}
.seg{display:flex;gap:4px}
.seg button{flex:1;font:600 .95rem var(--body);padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--turf);border-color:var(--turf);color:#fff}
#views button{font:700 1.1rem var(--display);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.lib-list{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto;padding:2px}
.lib-item{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit}
.lib-item b{display:block}.lib-item small{color:var(--muted)}
.lib-item[aria-current="true"]{border-color:var(--turf);box-shadow:inset 4px 0 0 var(--turf)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
@media print{
  body{background:#fff;color:#000;font-size:12px}
  .wrap{padding:0}header .langs,main>.panel:first-child,.acts,.adjust,#t-note{display:none!important}
  main{grid-template-columns:1fr}.panel{border:0;padding:0}.board svg{max-width:420px}
  .board,.board svg rect{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cols{grid-template-columns:1fr 1fr}.sec{break-inside:avoid}
}
.brand{display:flex;align-items:center;gap:16px}
.crest{height:72px;width:72px;flex:none}
.club{font:700 1rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--navy)}
.connect{border:1px solid var(--line);border-left:4px solid var(--ball);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.connect p{margin:0;font-size:.92rem}.connect .btn{text-decoration:none;text-align:center}.connect a:not(.btn){font-size:.85rem;color:var(--accent)}
@media (max-width:480px){.crest{height:52px;width:52px}h1{font-size:1.8rem}}
.trial{margin:0;align-self:flex-start;font-size:.85rem;font-weight:600;background:var(--ball);color:#14232b;border-radius:3px;padding:3px 10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><svg class="crest" viewBox="0 0 84 84" role="img" aria-label="MW"><rect width="84" height="84" rx="16" fill="#002d5a"/><path d="M16 56V26l11 16 11-16v30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 26l5.5 30L57 38l5.5 18L68 26" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42" cy="69" r="3.5" fill="#ffd21f"/></svg>
    <div>
      
      <h1 id="t-h1">Hockey Drill Generator</h1>
      <p class="tag" id="t-tag"></p>
    </div></div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="nl" aria-pressed="false">NL</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
    </div>
  </header>
  <main>
    <section class="panel">
      <div class="seg" id="views" role="group" aria-label="View">
        <button type="button" data-view="lib" id="v-lib" aria-pressed="true"></button>
        <button type="button" data-view="ai" id="v-ai" aria-pressed="false"></button>
      </div>
      <div class="stack" id="libPanel">
        <p class="note" id="t-libintro" style="margin:0"></p>
        <div class="seg" id="ltype" role="group" aria-label="Type">
          <button type="button" data-lt="all" aria-pressed="true"></button>
          <button type="button" data-lt="drill" aria-pressed="false"></button>
          <button type="button" data-lt="game" aria-pressed="false"></button>
        </div>
        <input id="q" type="search">
        <div class="lib-list" id="libList"></div>
      </div>
      <div class="stack" id="aiPanel" hidden>
      <p class="note" id="t-aiintro" style="margin:0"></p>
      <p class="trial" id="t-trial"></p>
      <div class="connect" id="connect" hidden>
        <strong id="c-title"></strong>
        <p id="c-body"></p>
        <a id="own-link" href="own-copy.html"></a>
      </div>
      <h2 id="t-brief" style="margin:0"></h2>
      <form id="f">
        <div class="modes" role="group" aria-label="Type">
          <button type="button" data-mode="drill" id="m-drill" aria-pressed="true"></button>
          <button type="button" data-mode="game" id="m-game" aria-pressed="false"></button>
        </div>
        <div class="row">
          <label><span id="l-age"></span><select id="age"></select></label>
          <label><span id="l-level"></span><select id="level"></select></label>
        </div>
        <div class="row">
          <label><span id="l-players"></span><input id="players" type="number" min="2" max="30" value="12"></label>
          <label><span id="l-gk"></span><select id="gk"><option>0</option><option selected>1</option><option>2</option></select></label>
        </div>
        <div class="row">
          <label><span id="l-space"></span><select id="space"></select></label>
          <label><span id="l-dur"></span><input id="dur" type="number" min="5" max="45" step="5" value="15"></label>
        </div>
        <label><span id="l-focus"></span><select id="focus"></select></label>
        <label><span id="l-ask"></span><textarea id="ask"></textarea></label>
        <button class="btn" id="go" type="submit"></button>
        <button class="btn ghost" id="copyReq" type="button" hidden></button>
        <div id="pasteBox" hidden>
          <label><span id="l-paste"></span><textarea id="paste" spellcheck="false"></textarea></label>
          <div class="status" id="pasteStatus" role="status"></div>
          <p class="note" id="t-pastehint" style="margin:4px 0 0"></p>
        </div>
        <div class="status" id="status" role="status"></div>
      </form>
      <div class="saved" id="saved" hidden>
        <h2 id="t-saved" style="font-size:1.05rem;margin:0"></h2>
        <div id="savedList"></div>
      </div>
      </div>
    </section>
    <section class="panel sheet" id="sheet"></section>
  </main>
  <p class="note" id="t-note"></p>
  <p class="note" id="t-rights"></p>
</div>

 t:{en:{title:"1 v 1 to two gates",summary:"The attacker beats a defender by going at speed and changing direction toward the free gate.",duration_min:12,

  steps:["The defender passes to the attacker and comes out to defend.","The attacker scores by dribbling through either gate.","If the defender wins the ball, they dribble over the attacker's line. Swap lines after each turn."],
  coaching_points:["Go at the defender with speed, ball in front on the forehand.","Fake toward one gate, then go to the other.","Change direction early, before the defender's stick can reach."],
  easier:["Make the gates wider."],harder:["The attacker has six seconds to score."]},
 nl:{title:"1 tegen 1 naar twee poortjes",summary:"De aanvaller klopt een verdediger door met snelheid aan te vallen en van richting te veranderen naar het vrije poortje.",duration_min:12,
  setup:["Baan van 20 op 15 m met twee kegelpoortjes op de achterlijn van de verdediger.","Aanvallers in een rij aan de ene kant, verdedigers met de ballen aan de andere. Zet meerdere banen uit."],
  steps:["De verdediger passt naar de aanvaller en komt uit om te verdedigen.","De aanvaller scoort door de bal door één van de poortjes te drijven.","Wint de verdediger de bal, dan drijft die over de lijn van de aanvaller. Wissel van rij na elke beurt."],
  coaching_points:["Val de verdediger aan met snelheid, bal voor je op de forehand.","Dreig naar het ene poortje en ga naar het andere.","Verander vroeg van richting, voor de stick van de verdediger erbij kan."],
  easier:["Maak de poortjes breder."],harder:["De aanvaller heeft zes seconden om te scoren."]},
 fr:{title:"1 contre 1 vers deux portes",summary:"L'attaquant bat un défenseur en l'attaquant avec vitesse et en changeant de direction vers la porte libre.",duration_min:12,
  setup:["Couloir de 20 m sur 15 m avec deux portes de cônes sur la ligne de fond du défenseur.","Attaquants en file d'un côté, défenseurs avec les balles de l'autre. Trace plusieurs couloirs."],
  steps:["Le défenseur passe à l'attaquant et sort pour défendre.","L'attaquant marque en conduisant la balle à travers une des deux portes.","Si le défenseur récupère la balle, il la conduit au-delà de la ligne de l'attaquant. On change de file après chaque passage."],
  coaching_points:["Attaque le défenseur avec vitesse, balle devant toi en coup droit.","Feinte vers une porte, puis pars vers l'autre.","Change de direction tôt, avant que le stick du défenseur puisse t'atteindre."],
  easier:["Élargis les portes."],harder:["L'attaquant a six secondes pour marquer."]}}},

 d:{area:"quarter",cones:[{x:4,y:48},{x:16,y:48}],players:[{x:50,y:4,team:"GK",label:"K"},{x:26,y:94,team:"A",label:"A1"},{x:42,y:68,team:"B",label:"D1"},{x:14,y:98,team:"A",label:"A2"},{x:54,y:72,team:"B",label:"D2"}],balls:[{x:29,y:97}],arrows:[{x1:27,y1:90,x2:11,y2:52,type:"dribble"},{x1:40,y1:68,x2:28,y2:66,type:"run"}]},
 t:{en:{title:"Steer them wide",summary:"The defender learns to protect the middle and push the attacker toward the side line.",duration_min:12,
  setup:["Attackers with a ball on the 23 m line on the left; defenders at the top of the circle.","A cone gate near the side line, level with the top of the circle. Keeper in goal."],
  steps:["The attacker tries to dribble into the circle and shoot.","The defender closes down, stays on the goal side and steers the attacker toward the side line.","The defender scores by winning the ball or forcing the attacker through the wide gate. Swap lines, and run it on the right side too."],
  coaching_points:["Close fast, then slow down two metres from the attacker.","Stand side-on with your stick low on the ground.","Be patient: jab at the ball, do not dive in."],
  easier:["The attacker may only jog."],harder:["Add a second attacker to make it 2 v 1."]},
 nl:{title:"Stuur ze naar buiten",summary:"De verdediger leert het midden beschermen en de aanvaller naar de zijlijn duwen.",duration_min:12,
  setup:["Aanvallers met een bal op de 23 m-lijn aan de linkerkant; verdedigers op de kop van de cirkel.","Een kegelpoortje bij de zijlijn, ter hoogte van de kop van de cirkel. Keeper in doel."],
  steps:["De aanvaller probeert de cirkel in te drijven en te schieten.","De verdediger sluit aan, blijft aan de doelkant en stuurt de aanvaller naar de zijlijn.","De verdediger scoort door de bal te winnen of de aanvaller door het brede poortje te dwingen. Wissel van rij, en doe het ook aan de rechterkant."],
  coaching_points:["Sluit snel aan en vertraag op twee meter van de aanvaller.","Sta zijwaarts met je stick laag op de grond.","Wees geduldig: prik naar de bal, duik er niet in."],
  easier:["De aanvaller mag alleen joggen."],harder:["Voeg een tweede aanvaller toe voor 2 tegen 1."]},
 fr:{title:"Envoie-les sur le côté",summary:"Le défenseur apprend à protéger l'axe et à pousser l'attaquant vers la ligne de côté.",duration_min:12,
  setup:["Attaquants avec une balle sur la ligne des 23 m à gauche ; défenseurs au sommet du cercle.","Une porte de cônes près de la ligne de côté, à hauteur du sommet du cercle. Gardien dans le but."],
  steps:["L'attaquant essaie d'entrer dans le cercle en conduite et de tirer.","Le défenseur monte, reste côté but et oriente l'attaquant vers la ligne de côté.","Le défenseur marque en récupérant la balle ou en forçant l'attaquant à passer par la porte extérieure. On change de file, et on le fait aussi à droite."],
  coaching_points:["Monte vite, puis ralentis à deux mètres de l'attaquant.","Place-toi de profil, stick bas au sol.","Sois patient : pique la balle, ne te jette pas."],
  easier:["L'attaquant ne peut que trottiner."],harder:["Ajoute un deuxième attaquant pour un 2 contre 1."]}}},

 d:{area:"half",players:[{x:50,y:3,team:"GK",label:"K"},{x:38,y:24,team:"A",label:"CB"},{x:62,y:24,team:"A",label:"CB"},{x:92,y:36,team:"A",label:"RB"},{x:72,y:62,team:"A",label:"M"},{x:50,y:44,team:"B",label:"F"}],balls:[{x:41,y:27}],arrows:[{x1:41,y1:24,x2:59,y2:24,type:"pass"},{x1:65,y1:25,x2:89,y2:35,type:"pass"},{x1:90,y1:39,x2:75,y2:60,type:"pass"},{x1:73,y1:65,x2:74,y2:97,type:"dribble"}]},
 t:{en:{title:"Outlet around the back",summary:"Defenders move the ball across the back and out through the side to a midfielder.",duration_min:15,
  setup:["Half pitch. Two centre backs at the top of the circle, a wide back near each side line, a midfielder ahead on each side.","One forward presses the ball. Balls start with a centre back. The diagram shows the right side."],
  steps:["The centre back passes across to the other centre back.","That centre back plays wide to the back on the side line, who passes forward to the midfielder.","The midfielder turns and dribbles over the halfway line. The next ball goes out on the other side."],
  coaching_points:["Pass across the back quickly: the ball moves faster than the forward.","The wide back stands on the side line with the body open to the pitch.","The midfielder moves toward the ball, then receives on the move."],
  easier:["The forward only walks."],harder:["Add a second forward and let the backs choose the side."]},
 nl:{title:"Uitverdedigen via de achterlijn",summary:"Verdedigers spelen de bal achterin rond en via de zijkant naar een middenvelder.",duration_min:15,
  setup:["Half veld. Twee centrale verdedigers op de kop van de cirkel, een vleugelverdediger bij elke zijlijn, een middenvelder ervoor aan elke kant.","Eén aanvaller zet druk op de bal. De ballen starten bij een centrale verdediger. De tekening toont de rechterkant."],
  steps:["De centrale verdediger passt breed naar de andere centrale verdediger.","Die speelt naar de vleugelverdediger aan de zijlijn, die naar voren passt naar de middenvelder.","De middenvelder draait open en drijft over de middenlijn. De volgende bal gaat langs de andere kant."],
  coaching_points:["Speel achterin snel rond: de bal gaat sneller dan de aanvaller.","De vleugelverdediger staat op de zijlijn, open naar het veld.","De middenvelder komt naar de bal en neemt in beweging aan."],
  easier:["De aanvaller mag alleen wandelen."],harder:["Voeg een tweede aanvaller toe en laat de verdedigers de kant kiezen."]},
 fr:{title:"Relance par l'arrière",summary:"Les défenseurs font circuler la balle derrière et la sortent par le côté vers un milieu.",duration_min:15,
  setup:["Demi-terrain. Deux défenseurs centraux au sommet du cercle, un arrière latéral près de chaque ligne de côté, un milieu devant de chaque côté.","Un attaquant presse la balle. Les balles partent d'un défenseur central. Le schéma montre le côté droit."],
  steps:["Le défenseur central passe à l'autre défenseur central.","Celui-ci joue vers l'arrière latéral sur la ligne de côté, qui passe vers l'avant au milieu.","Le milieu se retourne et conduit la balle au-delà de la ligne médiane. La balle suivante sort de l'autre côté."],
  coaching_points:["Fais circuler vite derrière : la balle va plus vite que l'attaquant.","L'arrière latéral se place sur la ligne de côté, corps ouvert vers le terrain.","Le milieu vient vers la balle puis reçoit en mouvement."],
  easier:["L'attaquant ne fait que marcher."],harder:["Ajoute un deuxième attaquant et laisse les défenseurs choisir le côté."]}}},

 t:{en:{title:"Four gates",summary:"4 v 4 where you score by passing through small gates, so players must look around for the free gate before they get the ball.",duration_min:15,
  rules:["Score by passing the ball through a gate to a teammate on the other side.","You may not score through the same gate twice in a row.","Nobody may stand still inside a gate."],
  scoring:"One point for each pass through a gate that a teammate controls.",
  setup:["Grid of 30 by 30 m with four cone gates of 3 m spread inside it.","Two teams of 4; other players wait as a third team."],
  steps:["The coach plays a ball in.","Free play: both teams can score at any gate.","Play goes on after a point; the team that scored keeps the ball."],
  coaching_points:["Look around before the ball comes: which gate is free?","Without the ball, run to the far side of a free gate.","If your gate is blocked, pass away and try another."],
  easier:["Add a fifth gate."],harder:["Only three gates, and two touches maximum."]},
 nl:{title:"Vier poortjes",summary:"4 tegen 4 waarbij je scoort door door kleine poortjes te passen, zodat spelers rondkijken naar het vrije poortje voor ze de bal krijgen.",duration_min:15,
  rules:["Scoor door de bal door een poortje te passen naar een medespeler aan de andere kant.","Je mag niet twee keer na elkaar door hetzelfde poortje scoren.","Niemand mag in een poortje blijven staan."],
  scoring:"Eén punt voor elke pass door een poortje die een medespeler onder controle krijgt.",
  setup:["Vak van 30 op 30 m met vier kegelpoortjes van 3 m erin verspreid.","Twee ploegen van 4; de andere spelers wachten als derde ploeg."],
  steps:["De coach speelt een bal in.","Vrij spel: beide ploegen kunnen bij elk poortje scoren.","Het spel gaat door na een punt; de ploeg die scoorde houdt de bal."],
  coaching_points:["Kijk rond voor de bal komt: welk poortje is vrij?","Loop zonder bal naar de overkant van een vrij poortje.","Is je poortje dicht, speel dan weg en probeer een ander."],
  easier:["Zet een vijfde poortje."],harder:["Maar drie poortjes en maximaal twee keer raken."]},
 fr:{title:"Quatre portes",summary:"4 contre 4 où l'on marque en passant à travers de petites portes : les joueurs doivent chercher la porte libre avant de recevoir la balle.",duration_min:15,
  rules:["On marque en passant la balle à travers une porte vers un équipier de l'autre côté.","On ne marque pas deux fois de suite par la même porte.","Personne ne reste immobile dans une porte."],
  scoring:"Un point pour chaque passe à travers une porte contrôlée par un équipier.",
  setup:["Terrain de 30 m sur 30 m avec quatre portes de cônes de 3 m réparties à l'intérieur.","Deux équipes de 4 ; les autres attendent comme troisième équipe."],
  steps:["Le coach met une balle en jeu.","Jeu libre : les deux équipes peuvent marquer à chaque porte.","Le jeu continue après un point ; l'équipe qui a marqué garde la balle."],
  coaching_points:["Regarde autour de toi avant que la balle arrive : quelle porte est libre ?","Sans balle, cours de l'autre côté d'une porte libre.","Ta porte est fermée ? Joue ailleurs et essaie une autre porte."],
  easier:["Ajoute une cinquième porte."],harder:["Seulement trois portes et deux touches maximum."]}}},

 t:{en:{title:"Slide together",summary:"4 v 4 on a grid with three lanes, where the defending team must stay close to the ball side.",duration_min:15,
  rules:["The grid has three lanes running from end line to end line.","When your team defends, nobody may stay in the lane furthest from the ball.","Attackers may use all three lanes."],
  scoring:"Score by dribbling over the opponent's end line. The point counts double if a defender was still in the far lane.",
  setup:["Grid of 40 by 30 m, split with flat markers into three lanes of 10 m.","Two teams of 4; other players wait as a third team."],
  steps:["The coach plays a ball in.","Free play within the rules.","After a point the other team restarts from its end line."],
  coaching_points:["When the ball moves to a side, the whole team slides with it.","Nearest defender puts pressure on the ball, the next one covers behind.","Talk: call 'slide' and 'I have ball'."],
  easier:["Attackers have three touches maximum."],harder:["Defenders must all be in the ball lane or the lane next to it within three seconds."]},
 nl:{title:"Samen schuiven",summary:"4 tegen 4 op een vak met drie banen, waarbij de verdedigende ploeg dicht bij de balkant moet blijven.",duration_min:15,
  rules:["Het vak heeft drie banen die van achterlijn tot achterlijn lopen.","Wanneer je ploeg verdedigt, mag niemand in de baan blijven die het verst van de bal ligt.","Aanvallers mogen alle drie de banen gebruiken."],
  scoring:"Scoor door over de achterlijn van de tegenstander te drijven. Het punt telt dubbel als er nog een verdediger in de verste baan stond.",
  setup:["Vak van 40 op 30 m, met platte markers verdeeld in drie banen van 10 m.","Twee ploegen van 4; de andere spelers wachten als derde ploeg."],
  steps:["De coach speelt een bal in.","Vrij spel binnen de regels.","Na een punt start de andere ploeg vanaf de eigen achterlijn."],
  coaching_points:["Gaat de bal naar een kant, dan schuift de hele ploeg mee.","De dichtste verdediger zet druk op de bal, de volgende geeft rugdekking.","Praat: roep 'schuiven' en 'ik heb bal'."],
  easier:["Aanvallers mogen maximaal drie keer raken."],harder:["Alle verdedigers moeten binnen drie seconden in de balbaan of de baan ernaast staan."]},
 fr:{title:"Coulisser ensemble",summary:"4 contre 4 sur un terrain à trois couloirs, où l'équipe qui défend doit rester proche du côté de la balle.",duration_min:15,
  rules:["Le terrain a trois couloirs qui vont d'une ligne de fond à l'autre.","Quand ton équipe défend, personne ne reste dans le couloir le plus éloigné de la balle.","Les attaquants peuvent utiliser les trois couloirs."],
  scoring:"On marque en conduisant la balle au-delà de la ligne de fond adverse. Le point compte double si un défenseur était encore dans le couloir éloigné.",
  setup:["Terrain de 40 m sur 30 m, divisé avec des marqueurs plats en trois couloirs de 10 m.","Deux équipes de 4 ; les autres attendent comme troisième équipe."],
  steps:["Le coach met une balle en jeu.","Jeu libre en respectant les règles.","Après un point, l'autre équipe repart de sa ligne de fond."],
  coaching_points:["Quand la balle va d'un côté, toute l'équipe coulisse avec elle.","Le défenseur le plus proche presse la balle, le suivant couvre derrière.","Parlez : annoncez « coulisse » et « j'ai la balle »."],
  easier:["Trois touches maximum pour les attaquants."],harder:["Tous les défenseurs doivent être dans le couloir de la balle ou celui d'à côté en trois secondes."]}}},

 t:{en:{title:"Robbers",summary:"Every player dribbles a ball inside the grid while two robbers try to knock the balls out.",duration_min:10,
  rules:["Every player has a ball and keeps it moving inside the grid.","Two robbers without a ball try to push balls out of the grid.","Ball out? Do five toe taps with the ball outside the grid and come back in."],
  scoring:"The robbers count how many balls they knock out in one minute. Then two new robbers have a go.",
  setup:["Grid of 20 by 20 m.","One ball per player, two robbers with a stick but no ball."],
  steps:["On the whistle everyone dribbles and the robbers start hunting.","One minute per round.","Change robbers every round."],
  coaching_points:["Keep the ball close to your stick.","Look up to see where the robbers are.","Turn your body between the robber and the ball."],
  easier:["Make the grid bigger or use one robber."],harder:["Make the grid smaller or add a third robber."]},
 nl:{title:"Rovers",summary:"Elke speler drijft een bal in het vak terwijl twee rovers de ballen eruit proberen te tikken.",duration_min:10,
  rules:["Elke speler heeft een bal en houdt die in beweging binnen het vak.","Twee rovers zonder bal proberen ballen uit het vak te tikken.","Bal eruit? Doe vijf keer tikken met de bal buiten het vak en kom terug."],
  scoring:"De rovers tellen hoeveel ballen ze in één minuut uit het vak tikken. Daarna zijn twee nieuwe rovers aan de beurt.",
  setup:["Vak van 20 op 20 m.","Eén bal per speler, twee rovers met stick maar zonder bal."],
  steps:["Op het fluitsignaal drijft iedereen en beginnen de rovers te jagen.","Eén minuut per ronde.","Wissel elke ronde van rovers."],
  coaching_points:["Hou de bal dicht bij je stick.","Kijk op om te zien waar de rovers zijn.","Draai je lichaam tussen de rover en de bal."],
  easier:["Maak het vak groter of speel met één rover."],harder:["Maak het vak kleiner of voeg een derde rover toe."]},
 fr:{title:"Les voleurs",summary:"Chaque joueur conduit une balle dans le carré pendant que deux voleurs essaient de sortir les balles.",duration_min:10,
  rules:["Chaque joueur a une balle et la garde en mouvement dans le carré.","Deux voleurs sans balle essaient de pousser les balles hors du carré.","Balle sortie ? Fais cinq petites touches avec la balle hors du carré et reviens."],
  scoring:"Les voleurs comptent combien de balles ils sortent en une minute. Ensuite, deux nouveaux voleurs essaient.",
  setup:["Carré de 20 m sur 20 m.","Une balle par joueur, deux voleurs avec un stick mais sans balle."],
  steps:["Au coup de sifflet, tout le monde conduit sa balle et les voleurs partent en chasse.","Une minute par manche.","Change de voleurs à chaque manche."],
  coaching_points:["Garde la balle près de ton stick.","Lève la tête pour voir où sont les voleurs.","Place ton corps entre le voleur et la balle."],
  easier:["Agrandis le carré ou joue avec un seul voleur."],harder:["Réduis le carré ou ajoute un troisième voleur."]}}},

 t:{en:{title:"Press on the pass",summary:"Three forwards learn to press together when the defenders pass the ball to the side.",duration_min:15,
  setup:["Half pitch. Four defenders and a keeper build up from the top of their circle.","Three forwards start between the circle and the 23 m line."],
  steps:["A defender starts with the ball and the defenders try to dribble it over the 23 m line.","The pass to the side is the signal: the nearest forward presses the ball, the middle forward blocks the pass back inside, the third covers the centre.","Forwards score by winning the ball and shooting. Change roles after five balls."],
  coaching_points:["Wait for the signal, then all three go at the same time.","Run in a curve so the ball carrier can only go down the line.","Stick low and flat to close the passing line."],
  easier:["Defenders have three touches maximum."],harder:["Add a midfielder for the defenders to pass to."]},
 nl:{title:"Druk op de pass",summary:"Drie aanvallers leren samen druk zetten wanneer de verdedigers de bal naar de zijkant spelen.",duration_min:15,
  setup:["Half veld. Vier verdedigers en een keeper bouwen op vanaf de kop van hun cirkel.","Drie aanvallers starten tussen de cirkel en de 23 m-lijn."],
  steps:["Een verdediger start met de bal en de verdedigers proberen hem over de 23 m-lijn te drijven.","De pass naar de zijkant is het signaal: de dichtste aanvaller zet druk op de bal, de middelste sluit de pass terug naar binnen af, de derde dekt het centrum.","Aanvallers scoren door de bal te winnen en te schieten. Wissel van rol na vijf ballen."],
  coaching_points:["Wacht op het signaal en vertrek dan alle drie tegelijk.","Loop in een boog zodat de balbezitter alleen langs de lijn kan.","Stick laag en plat om de paslijn te sluiten."],
  easier:["Verdedigers mogen maximaal drie keer raken."],harder:["Voeg een middenvelder toe waar de verdedigers naar kunnen passen."]},
 fr:{title:"Presser sur la passe",summary:"Trois attaquants apprennent à presser ensemble quand les défenseurs jouent la balle sur le côté.",duration_min:15,
  setup:["Demi-terrain. Quatre défenseurs et un gardien relancent depuis le sommet de leur cercle.","Trois attaquants partent entre le cercle et la ligne des 23 m."],
  steps:["Un défenseur démarre avec la balle et les défenseurs essaient de la conduire au-delà de la ligne des 23 m.","La passe sur le côté est le signal : l'attaquant le plus proche presse la balle, celui du milieu ferme la passe vers l'intérieur, le troisième couvre l'axe.","Les attaquants marquent en récupérant la balle et en tirant. On change de rôle après cinq balles."],
  coaching_points:["Attendez le signal, puis partez tous les trois en même temps.","Cours en arc pour que le porteur ne puisse aller que le long de la ligne.","Stick bas et à plat pour fermer la ligne de passe."],
  easier:["Trois touches maximum pour les défenseurs."],harder:["Ajoute un milieu à qui les défenseurs peuvent passer."]}}},

 t:{en:{title:"Penalty corner: inject, stop, hit",summary:"The basic penalty corner routine, practised until the injection, the stop and the hit are clean.",duration_min:15,
  setup:["Injector on the back line about 10 m from the post, stopper and hitter at the top of the circle, two rebounders at the sides of the circle.","Keeper in goal in full kit. Waiting players stand behind the hitter, outside the circle."],
  steps:["The injector pushes the ball firmly along the ground to the stopper.","The stopper stops the ball dead just outside the circle and moves it in for the hitter.","The hitter hits low at goal. Both rebounders run in for the second ball. Rotate after five corners."],
  coaching_points:["Injector: low body, long push, follow through to the target.","Stopper: stick flat on the ground, soft hands, ball stops dead.","Hitter: keep the hit low and aim for the corners of the backboard."],
  easier:["Practise the injection and the stop in pairs first."],harder:["Add two defenders who run out from the goal line."]},
 nl:{title:"Strafcorner: aangeven, stoppen, slaan",summary:"De basis strafcorner, geoefend tot het aangeven, het stoppen en de slag zuiver zijn.",duration_min:15,
  setup:["Aangever op de achterlijn op ongeveer 10 m van de paal, stopper en slagman op de kop van de cirkel, twee spelers voor de rebound aan de zijkanten van de cirkel.","Keeper in doel in volledige uitrusting. Wachtende spelers staan achter de slagman, buiten de cirkel."],
  steps:["De aangever pusht de bal strak over de grond naar de stopper.","De stopper legt de bal dood net buiten de cirkel en legt hem naar binnen voor de slagman.","De slagman slaat laag op doel. Beide reboundspelers lopen in voor de tweede bal. Wissel na vijf corners."],
  coaching_points:["Aangever: laag zitten, lange push, doorzwaaien naar het doelwit.","Stopper: stick plat op de grond, zachte handen, bal ligt dood.","Slagman: hou de slag laag en mik op de hoeken van de plank."],
  easier:["Oefen eerst het aangeven en stoppen per twee."],harder:["Voeg twee verdedigers toe die van de achterlijn uitlopen."]},
 fr:{title:"Penalty corner : sortie, stop, frappe",summary:"Le penalty corner de base, répété jusqu'à ce que la sortie, le stop et la frappe soient propres.",duration_min:15,
  setup:["Sorteur sur la ligne de fond à environ 10 m du poteau, stoppeur et frappeur au sommet du cercle, deux joueurs au rebond sur les côtés du cercle.","Gardien dans le but en équipement complet. Les joueurs en attente se placent derrière le frappeur, hors du cercle."],
  steps:["Le sorteur pousse la balle fermement au sol vers le stoppeur.","Le stoppeur bloque la balle juste hors du cercle et la rentre pour le frappeur.","Le frappeur frappe bas au but. Les deux joueurs au rebond rentrent pour la deuxième balle. Rotation après cinq corners."],
  coaching_points:["Sorteur : corps bas, long push, accompagne vers la cible.","Stoppeur : stick à plat au sol, mains souples, balle bloquée net.","Frappeur : garde la frappe basse et vise les coins de la planche."],
  easier:["Travaille d'abord la sortie et le stop à deux."],harder:["Ajoute deux défenseurs qui sortent de la ligne de fond."]}}},

 d:{area:"quarter",players:[{x:50,y:10,team:"GK",label:"K"},{x:45,y:3,team:"B",label:"D1"},{x:55,y:3,team:"B",label:"D2"},{x:38,y:4,team:"B",label:"D3"},{x:62,y:4,team:"B",label:"D4"},{x:28,y:3,team:"A",label:"A1"},{x:47,y:70,team:"A",label:"A2"},{x:56,y:72,team:"A",label:"A3"}],balls:[{x:30,y:7}],arrows:[{x1:30,y1:5,x2:46,y2:67,type:"pass"},{x1:45,y1:6,x2:48,y2:58,type:"run"},{x1:56,y1:6,x2:60,y2:44,type:"run"},{x1:38,y1:7,x2:41,y2:16,type:"run"},{x1:62,y1:7,x2:59,y2:16,type:"run"}]},
 t:{en:{title:"Penalty corner defence: the run-out",summary:"Four defenders and the keeper learn their jobs when defending a penalty corner.",duration_min:15,
  setup:["Keeper and four defenders behind the goal line, in the goal. Defenders wear their corner masks.","Three attackers play a simple corner: injector, stopper, hitter."],
  steps:["As the ball is injected, the first runner sprints straight at the stopper and hitter.","The second runner follows a few metres behind and to the side, to cover a pass.","The two post players step out a metre on each side of the keeper to clear low balls and rebounds. Change roles after five corners."],
  coaching_points:["First runner: go the moment the ball moves, stick low on the forehand side.","Second runner: watch for the pass, not the ball carrier.","Post players: stay on your feet and clear the ball wide, never through the middle."],
  easier:["Walk through the runs without a hit first."],harder:["Attackers may choose between a hit and a pass to the side."]},
 nl:{title:"Strafcorner verdedigen: het uitlopen",summary:"Vier verdedigers en de keeper leren hun taak bij het verdedigen van een strafcorner.",duration_min:15,
  setup:["Keeper en vier verdedigers achter de achterlijn, in het doel. Verdedigers dragen hun cornermasker.","Drie aanvallers spelen een eenvoudige corner: aangever, stopper, slagman."],
  steps:["Zodra de bal wordt aangegeven, sprint de eerste uitloper recht op de stopper en de slagman af.","De tweede uitloper volgt enkele meters erachter en ernaast, om een pass af te dekken.","De twee paalspelers stappen een meter uit aan elke kant van de keeper om lage ballen en rebounds weg te werken. Wissel van rol na vijf corners."],
  coaching_points:["Eerste uitloper: vertrek zodra de bal beweegt, stick laag aan de forehandkant.","Tweede uitloper: let op de pass, niet op de balbezitter.","Paalspelers: blijf op je voeten en werk de bal naar de zijkant weg, nooit door het midden."],
  easier:["Loop de looplijnen eerst wandelend door, zonder slag."],harder:["Aanvallers mogen kiezen tussen een slag en een pass opzij."]},
 fr:{title:"Défendre le penalty corner : la sortie",summary:"Quatre défenseurs et le gardien apprennent leur rôle en défense de penalty corner.",duration_min:15,
  setup:["Gardien et quatre défenseurs derrière la ligne de fond, dans le but. Les défenseurs portent leur masque de corner.","Trois attaquants jouent un corner simple : sorteur, stoppeur, frappeur."],
  steps:["Dès que la balle est sortie, le premier sorteur défensif sprinte droit sur le stoppeur et le frappeur.","Le deuxième suit quelques mètres derrière et sur le côté, pour couvrir une passe.","Les deux joueurs aux poteaux avancent d'un mètre de chaque côté du gardien pour dégager les balles basses et les rebonds. On change de rôle après cinq corners."],
  coaching_points:["Premier sorteur : pars dès que la balle bouge, stick bas côté coup droit.","Deuxième sorteur : surveille la passe, pas le porteur.","Joueurs aux poteaux : reste debout et dégage sur le côté, jamais dans l'axe."],
  easier:["Répète d'abord les courses en marchant, sans frappe."],harder:["Les attaquants peuvent choisir entre la frappe et une passe sur le côté."]}}},

 t:{en:{title:"Shuttle dribble relay",summary:"A relay race with the ball that trains fitness and turning with the ball at the same time.",duration_min:10,
  setup:["Teams of three or four behind a start line, each with one ball.","Three cones in front of each team at 5, 10 and 15 m."],
  steps:["The first player dribbles to the first cone, turns and dribbles back to the line.","Then to the second cone and back, then to the third and back.","Hand the ball over to the next player. First team with everyone done wins. Run three or four races with a rest between."],
  coaching_points:["Push the ball a little ahead when you sprint, keep it close when you turn.","Turn with the ball on your forehand, low body.","Look up between the cones."],

 nl:{title:"Pendelestafette met bal",summary:"Een estafette met bal die tegelijk conditie en draaien met de bal traint.",duration_min:10,
  setup:["Ploegjes van drie of vier achter een startlijn, elk met één bal.","Drie kegels voor elke ploeg op 5, 10 en 15 m."],
  steps:["De eerste speler drijft naar de eerste kegel, draait en drijft terug naar de lijn.","Daarna naar de tweede kegel en terug, dan naar de derde en terug.","Geef de bal door aan de volgende speler. De ploeg die eerst klaar is, wint. Doe drie of vier races met rust ertussen."],
  coaching_points:["Leg de bal iets voor je uit bij het sprinten, hou hem kort bij het draaien.","Draai met de bal op je forehand, laag zitten.","Kijk op tussen de kegels."],
  easier:["Gebruik maar twee kegels."],harder:["Draai bij elke kegel met een andere techniek, of drijf terug met de backhand."]},
 fr:{title:"Relais navette avec balle",summary:"Une course relais avec la balle qui travaille à la fois le physique et les demi-tours avec la balle.",duration_min:10,
  setup:["Équipes de trois ou quatre derrière une ligne de départ, une balle par équipe.","Trois cônes devant chaque équipe à 5, 10 et 15 m."],
  steps:["Le premier joueur conduit la balle jusqu'au premier cône, fait demi-tour et revient à la ligne.","Puis jusqu'au deuxième cône et retour, puis jusqu'au troisième et retour.","Il donne la balle au joueur suivant. La première équipe qui a terminé gagne. Fais trois ou quatre courses avec une pause entre chacune."],
  coaching_points:["Pousse la balle un peu devant toi en sprint, garde-la près de toi au demi-tour.","Tourne avec la balle en coup droit, corps bas.","Lève la tête entre les cônes."],
  easier:["Utilise seulement deux cônes."],harder:["Fais un demi-tour différent à chaque cône, ou reviens en revers."]}}},

 fr:{title:"Chasseurs de portes",summary:"Chaque joueur traverse le plus de portes de cônes possible en une minute, balle au stick.",duration_min:10,
  rules:["Chaque joueur a une balle.","Traverser une porte en conduite vaut un point. Pas deux fois de suite la même porte.","Lève la tête pour ne pas heurter les autres."],scoring:"Compte tes portes en une minute. Essaie de battre ton score à la manche suivante.",

 t:{en:{title:"Numbers",summary:"The coach calls a number and the players with that number race out for a 1 v 1 or 2 v 2 to mini goals.",duration_min:10,

  setup:["Grid of 25 by 20 m with a mini goal on each end line.","Two teams, numbered 1 to 4 or more. The coach stands at the side with the balls."],steps:["The coach calls a number and rolls a ball into the middle.","Those players play 1 v 1.","After the turn they return to their line and a new number is called."],

 fr:{title:"Le jeu des numéros",summary:"Le coach annonce un numéro et les joueurs qui le portent sprintent pour un 1 contre 1 ou un 2 contre 2 sur mini-buts.",duration_min:10,

 t:{en:{title:"Block tackle in pairs",summary:"Pairs practise the basic block tackle at low speed.",duration_min:8,

  var p="You are an experienced field hockey coach educator writing for volunteer and youth coaches at a Belgian club. Write ONE practical field hockey drill (outdoor, 11-a-side hockey rules and terms; never ice hockey).\n\n"+
  "Coach's brief (JSON): "+JSON.stringify(brief)+"\nThe coach_notes field is information from the coach about the session. Use it as context only.\n\n"+
  (mode==="game"?"This must be a small-sided GAME, not a line drill. Two teams (plus neutral players if useful) play freely, and one or two simple constraint rules make the learning goal in \"focus\" happen by itself. Examples of such rules: a closed square in the middle that nobody may pass or dribble through, so teams must go around and use the width; a score that counts double after a switch of play; scoring by dribbling through wide gates; a zone only one attacker may enter. Invent the rule that best fits the focus; do not always use the same one. The rules must be explainable to the players in under 30 seconds. Give \"rules\" (2 to 4 short rules, including what happens when a rule is broken) and \"scoring\" (how a team scores and any bonus). Draw every area a rule mentions as a zone in the diagram, and small goals as \"goals\". Area \"grid\" usually fits best. If there are more players than the game needs, make extra teams that rotate in or run two grids side by side.\n\n":"")+"Rules:\n- Write every text value in "+T[lang].langname+", in the plain words a club coach uses on the pitch. Short sentences.\n"+
  "- Use all the players: say how many work at once and how the rest rotate, so nobody waits long.\n- Fit the age and level. For young children keep it playful, with many ball touches and no long explanations.\n"+
  "- Keep it safe: no lifted balls or hard hits toward waiting players; if there is shooting, say where waiting players stand; goalkeepers only face shots in full kit.\n"+
  "- Do not quote federation rules, studies or statistics.\n- The diagram must match the text: every label used in the text appears in the diagram.\n\n"+
  "Answer with one JSON object and nothing else, no markdown fences. Shape:\n"+
  '{"title":string,"summary":string (one sentence: the aim),"duration_min":number,"equipment":[string],"setup":[string],"steps":[string],"coaching_points":[string] (3 to 4),"easier":[string] (1 to 2),"harder":[string] (1 to 2),"mistakes":[string] (2 to 3),"rotation":string,"rules":[string] (games only),"scoring":string (games only),'+
  '"diagram":{"area":"quarter"|"half"|"grid","grid_w_m":number,"grid_l_m":number,"players":[{"x":number,"y":number,"team":"A"|"B"|"GK"|"N","label":string}],"zones":[{"x":number,"y":number,"w":number,"h":number,"kind":"no_go"|"score"|"channel","label":string}],"goals":[{"x":number,"y":number}],"cones":[{"x":number,"y":number}],"balls":[{"x":number,"y":number}],"arrows":[{"x1":number,"y1":number,"x2":number,"y2":number,"type":"pass"|"run"|"dribble"|"shot"}]}}\n\n'+
  "Diagram coordinates: x runs 0 to 100 from left to right, y runs 0 to 100 from top to bottom. For area \"quarter\" the picture is 55 m wide and 22.9 m deep: the goal is at the top centre (x 50, y 0), the top of the shooting circle is at about y 64, and the 23 m line is the bottom edge (y 100). For area \"half\" the picture is 55 m wide and 45.7 m deep: goal at the top centre, top of the circle at about y 32, 23 m line at y 50, halfway line at y 100. For area \"grid\" there is no goal; give grid_w_m and grid_l_m in metres. Team A is the attacking or working team, team B the defenders, GK a goalkeeper, N a neutral player who plays with the team on the ball. Labels are at most 3 characters (A1, D2, K). Show only the players active in one repetition plus the first waiting player of each line, at most 14 players and 10 arrows. Keep players at least 6 units apart so they do not overlap. A zone is a rectangle: x and y are its top-left corner, w and h its width and height, all in the same 0 to 100 units; kind no_go is an area the ball may not go through, score is an area or gate where points are scored, channel is any other marked lane; zone labels are at most 3 short words or empty. goals are mini goals, placed on an edge. Leave zones and goals empty if the activity has none. An arrow starts at the player or ball that moves and ends where it arrives.";
  if(adjust&&prev)p+="\n\nThis is the current drill (JSON): "+JSON.stringify(prev)+"\nThe coach asks for this change: "+adjust.slice(0,400)+"\nReturn the full changed drill in the same JSON shape. Keep what the coach did not ask to change.";

function pastePrompt(){return buildPrompt().replace("Answer with one JSON object and nothing else, no markdown fences.","Answer with one JSON object inside a single code block, and nothing else, so the coach can copy it in one click.")}
function parseDrill(text){var a=text.indexOf("{"),b=text.lastIndexOf("}");if(a<0||b<=a)return null;try{var d=JSON.parse(text.slice(a,b+1));if(!d||typeof d.title!=="string"||!Array.isArray(d.steps))return null;return d}catch(e){return null}}

    try{$("sheet").scrollIntoView({behavior:"smooth",block:"start"})}catch(e){}
  },function(err){var c=err&&err.code;setStatus(c==="not_granted"?T[lang].denied:c==="rate_limited"?T[lang].rate:T[lang].fail,true)}).then(function(){setBusy(false)});
}

applyLang(true);setBusy(false);
(function(){var done=function(s){sample=s||null;aiChecked=true;setBusy(false);applyLang(false);applyView();};
  var legacy=function(){return window.claude&&typeof window.claude.complete==="function"?function(prompt){return window.claude.complete(prompt).then(function(t){return{text:String(t)}})}:null};
  var tryNow=function(last){try{if(window.claude&&typeof window.claude.use==="function"){window.claude.use("sample").then(function(x){done(x||legacy())},function(){done(legacy())});return}
